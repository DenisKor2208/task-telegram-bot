services:
  postgres:
    container_name: postgres_tgbot
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_TRUST_LOCALNET: true
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_tgbot_task_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis_tgbot
    image: redis:alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_tgbot_task_data:/data

  migrator:
    build: .
    container_name: tgbot_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrator", "up"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    volumes:
      - ./migrations:/app/migrations
      - ./config/config.docker.yaml:/app/config/config.yaml

  app:
    build: .
    container_name: tgbot_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["./app"]
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml

volumes:
  postgres_tgbot_task_data:
  redis_tgbot_task_data:
