services:
  postgres:
    container_name: postgres_tgbot
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_tgbot_task_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis_tgbot
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Задайте REDIS_PASSWORD в .env}"]
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_tgbot_task_data:/data

  migrator:
    build: .
    container_name: tgbot_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrator", "up"]
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable"
    volumes:
      - ./migrations:/app/migrations

  app:
    build: .
    container_name: tgbot_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    # Адреса сервисов внутри Docker; перекрывают строки для localhost из .env
    environment:
      DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} sslmode=disable"
      REDIS_CONNECTION_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
    command: ["./app"]
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml

volumes:
  postgres_tgbot_task_data:
  redis_tgbot_task_data:
